services:
  postgres: {image: "postgres:16", environment: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: scheduler}, ports: ["5432:5432"], volumes: ["pg:/var/lib/postgresql/data"]}
  redis: {image: "redis:7", command: "redis-server --appendonly yes", ports: ["6379:6379"], volumes: ["rd:/data"]}
  elasticsearch: {image: "docker.elastic.co/elasticsearch/elasticsearch:8.13.4", environment: {discovery.type: single-node, xpack.security.enabled: "false", ES_JAVA_OPTS: "-Xms512m -Xmx512m"}, ports: ["9200:9200"]}
volumes: {pg: {}, rd: {}}
